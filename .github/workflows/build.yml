name: Build & Test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest   # Apple Silicon (arm64) runner
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version && sw_vers
      - name: Unit tests
        run: swift test --parallel
      - name: Build app
        run: ./scripts/build-app.sh
      - name: End-to-end tests (real app + system pasteboard)
        run: ./scripts/e2e/run.sh
      - name: Check app icon
        run: |
          test -s build/CopyT.app/Contents/Resources/AppIcon.icns
          sips -g pixelWidth -g pixelHeight build/CopyT.app/Contents/Resources/AppIcon.icns
          # 渲染 macOS 实际为该应用显示的图标，作为构建产物供检查
          cat > /tmp/appicon.swift <<'SWIFT'
          import AppKit
          let app = CommandLine.arguments[1], out = CommandLine.arguments[2]
          let icon = NSWorkspace.shared.icon(forFile: app)
          icon.size = NSSize(width: 256, height: 256)
          let rep = NSBitmapImageRep(bitmapDataPlanes: nil, pixelsWide: 256, pixelsHigh: 256, bitsPerSample: 8,
                                     samplesPerPixel: 4, hasAlpha: true, isPlanar: false,
                                     colorSpaceName: .deviceRGB, bytesPerRow: 0, bitsPerPixel: 0)!
          NSGraphicsContext.current = NSGraphicsContext(bitmapImageRep: rep)
          icon.draw(in: NSRect(x: 0, y: 0, width: 256, height: 256))
          NSGraphicsContext.current = nil
          try! rep.representation(using: .png, properties: [:])!.write(to: URL(fileURLWithPath: out))
          // 断言拿到的是 CopyT 的图标而不是系统默认图标：底部中间应为蓝色，卡片中间应接近白色
          func rgb(_ x: Int, _ y: Int) -> (Int, Int, Int) {
              let c = rep.colorAt(x: x, y: y)!
              return (Int(c.redComponent * 255), Int(c.greenComponent * 255), Int(c.blueComponent * 255))
          }
          let bottom = rgb(128, 214), card = rgb(100, 150)
          print("bottom pixel rgb=\(bottom)  card pixel rgb=\(card)")
          guard bottom.2 > 150, bottom.0 < 120, card.0 > 200, card.1 > 200, card.2 > 200 else {
              print("❌ 应用图标不是预期的 CopyT 图标"); exit(1)
          }
          print("✅ 应用图标已生效")
          SWIFT
          swiftc -O /tmp/appicon.swift -o /tmp/appicon
          /tmp/appicon "$PWD/build/CopyT.app" "$PWD/build/app-icon-rendered.png"
          echo "ICON_B64_BEGIN"; base64 -i build/app-icon-rendered.png | fold -w 200; echo "ICON_B64_END"
      - uses: actions/upload-artifact@v4
        with:
          name: app-icon-rendered
          path: build/app-icon-rendered.png
      - name: Zip
        run: cd build && ditto -c -k --keepParent CopyT.app CopyT.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CopyT-arm64
          path: build/CopyT.zip

  # 只用 Command Line Tools（不用完整 Xcode）编译，确保没有依赖 SwiftUI 宏插件
  build-clt:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Command Line Tools
        run: |
          sudo xcode-select -s /Library/Developer/CommandLineTools
          xcode-select -p
          swift --version
      - name: Build
        run: swift build -c release --arch arm64
