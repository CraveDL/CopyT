name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest   # Apple Silicon (arm64) runner
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build app
        run: ./scripts/build-app.sh
      - name: Zip
        run: cd build && ditto -c -k --keepParent CopyT.app CopyT.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CopyT-arm64
          path: build/CopyT.zip

  # 只用 Command Line Tools（不用完整 Xcode）编译，确保没有依赖 SwiftUI 宏插件
  build-clt:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Command Line Tools
        run: |
          sudo xcode-select -s /Library/Developer/CommandLineTools
          xcode-select -p
          swift --version
      - name: Build
        run: swift build -c release --arch arm64
