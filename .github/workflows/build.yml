name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest   # Apple Silicon (arm64) runner
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build app
        run: ./scripts/build-app.sh
      - name: Zip
        run: cd build && ditto -c -k --keepParent CopyT.app CopyT.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CopyT-arm64
          path: build/CopyT.zip
